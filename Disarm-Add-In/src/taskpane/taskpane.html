<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contoso Task Pane Add-in</title>

    <!-- Office JavaScript API -->
    <script src="https://code.jquery.com/jquery-3.4.1.js"></script>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link rel="stylesheet" href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/11.0.0/css/fabric.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/9.6.1/css/fabric.min.css">
    
    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
   
</head>


<body class="ms-font-m ms-welcome ms-Fabric">
   

 <p id="lines">Insert Red Tag</p>

    <button class="ms-Button" id="insert-red-tag"><div class="iconRed">&#9632;</div>Choose Technique(s)</button>

    <div id="plugin-container" class="popup">
        <span class="close" id="close-btn"></span>
        <p>To which phase does the behavior belong?</p>
        <select id="option1">
            <option value="option1">Plan</option>
            <option value="option2">Prepare</option>
            <option value="option3">Execute</option>
            <option value="option4">Assess</option>
        </select>

        <p>To which tactic does the behavior belong?</p>
        <select id="option2" style="display: none;">
            
            <!-- Options will be dynamically loaded based on the selection of the first dropdown -->
        </select>
        <p>Which technique(s) capture the behavior?<p>
        <div class="scrollable-box" >
            <div class="checkbox-container" id="option3" style="display: none;"> </div>
            
        </div>
        <button class="save-btn" id="save-btn">Select technique(s)</button>
    </div>

    <button class="ms-Button" id="search-red-tag"><div class="iconRed">&#9632;</div>Search Technique(s)</button>

    <p id="lines">Insert Blue Tag</p>

    <button class="ms-Button" id="insert-blue-tag"><div class="iconBlue">&#9632;</div>Choose Countermeasure(s)</button>
    <button class="ms-Button" id="insert-blue-tag"><div class="iconBlue">&#9632;</div>Search Countermeasure(s)</button>
    <p id="lines">Summaries</p> 

    <button class="ms-Button" id="insert-red-table"><i class="ms-Icon ms-font-l ms-Icon--Table ms-fontColor-neutralSecondary"></i>Insert Summary Red Table</button>
    <button class="ms-Button" id="insert-blue-table"><i class="ms-Icon ms-font-l ms-Icon--Table ms-fontColor-neutralSecondary"></i>Insert Summary Blue Table</button>
    <p id="lines">Format Red</p>

    <button class="ms-Button" id="format-red-tag-color" ><i class="ms-Icon ms-font-m ms-Icon--Brush ms-fontColor-neutralSecondary"></i>Red Tag</button>
    <div id="plugin-container-red-tag" class="popup">
        <span class="close" id="close-btn1"></span>
        <p>Choose color for red tags</p>
        <div class="color-picker-container">
            <input type="color" id="colorPicker" value="#FFFF00">
            <div class="overlay-text">(sample technique [T.....])</div>
        </div>
        
        <button class="save-btn" id="save-btn1">Save</button>
    </div>    
    


    <button class="ms-Button" id="clear-history"><i class="ms-Icon ms-font-l ms-Icon--BucketColor ms-fontColor-neutralSecondary"></i>Red Graphic</button>
    <p id="lines">Explore</p>

    <button class="ms-Button" id="explorer"><i class="ms-Icon ms-font-l ms-Icon--SearchAndApps ms-fontColor-neutralSecondary"></i>Explorer</button>
    <button class="ms-Button" id="github"><i class="ms-Icon ms-font-l ms-Icon--OpenEnrollment ms-fontColor-neutralSecondary"></i>GitHub</button>
</body>

</html>
