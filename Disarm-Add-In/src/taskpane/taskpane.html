<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contoso Task Pane Add-in</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link rel="stylesheet" href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/11.0.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">
    <header class="ms-welcome__header ms-bgColor-neutralLighter">
        <img width="90" height="90" src="../../assets/logo-filled.png" alt="Contoso" title="Contoso" />
        <h1 class="ms-font-su">Welcome</h1>
    </header>

    <button class="ms-Button" id="insert-red-tag">Insert Red Tag</button><br/><br/>

    <div id="plugin-container" class="popup">
        <h3>To which phase does the behavior belong?</h3>
        <select id="option1">
            <option value="option1">Plan</option>
            <option value="option2">Prepare</option>
            <option value="option3">Execute</option>
            <option value="option4">Assess</option>
        </select>

        <h3>To which tactic does the behavior belong?</h3>
        <select id="option2" style="display: none;">
            
            <!-- Options will be dynamically loaded based on the selection of the first dropdown -->
        </select>
        <h3>Which technique(s) capture the behavior?</h3>
        <div id="option3" style="display: none;">
            
            <label><input type="checkbox" value="item1"> Item 1</label><br>
            <label><input type="checkbox" value="item2"> Item 2</label><br>
            <label><input type="checkbox" value="item3"> Item 3</label><br>
        </div>
        <button id="save-btn">Save</button>
    </div>
   

    <button class="ms-Button" id="insert-red-table">Insert Red Table</button><br/><br/>
</body>

</html>
